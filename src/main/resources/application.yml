# Configuración común a todos los ambientes.
# Lo que cambia entre dev y prod (datasource, logging, ddl-auto, jwt.secret)
# vive en application-dev.yml / application-prod.yml.

spring:
  application:
    name: fundamentos01
  profiles:
    active: dev
  jpa:
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  servlet:
    context-path: /api
  error:
    include-message: always

# Actuator: solo se exponen los endpoints necesarios para monitoreo.
# /actuator/health queda público (SecurityConfig), el resto exige ROLE_ADMIN.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    # Nadie usa Redis todavía (quedó como dependencia agregada de más en
    # build.gradle), pero Actuator lo detecta en el classpath y lo incluye
    # en el health check por defecto. Sin esto, /actuator/health marca DOWN
    # aunque la app funcione perfecto.
    redis:
      enabled: false

# Swagger UI / OpenAPI: rutas y orden de la documentación interactiva.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

# ============== CONFIGURACIÓN DE JWT (común) ==============
jwt:
  # Tiempo de expiración del access token (30 minutos)
  expiration: 1800000

  # Tiempo de expiración del refresh token (7 días)
  refresh-expiration: 604800000

  # Issuer del token
  issuer: fundamentos01-api

  # Header donde se envía el token
  header: Authorization

  # Prefijo del token
  prefix: "Bearer "
